<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC Raiders // Advanced Resource Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* ========================================= */
        /* I. CSS VARIABLES & NEON REFINEMENT */
        /* ========================================= */
        :root {
            --color-neon-blue: #00e5ff; 
            --color-accent-orange: #ff7f2a; 
            --color-highlight-yellow: #ffea5a;
            --color-dark-bg: rgba(3, 5, 8, 1); 
            --color-panel: rgba(12, 18, 25, 0.95); 
            --color-text: #e0e6f0; 
            --color-text-dim: #99a2b5;
            --color-missing: #e9546d; 
            --color-enough: #4caf50; 
            
            --neon-glow-blue-sm: 0 0 4px var(--color-neon-blue);
            --neon-glow-blue-lg: 0 0 8px var(--color-neon-blue), 0 0 16px rgba(0, 229, 255, 0.4);
            --neon-glow-orange: 0 0 6px var(--color-accent-orange);
            --neon-glow-yellow-sm: 0 0 3px var(--color-highlight-yellow);
            --shadow-inset: inset 0 0 10px rgba(0, 229, 255, 0.05);
            --border-panel: 1px solid var(--color-neon-blue);
        }

        /* ========================================= */
        /* II. BASE STYLES & LAYOUT */
        /* ========================================= */

        /* Масштаб 80% через уменьшение шрифта */
        html {
            font-size: 13px; 
        }

        body {
            margin: 0;
            padding: 0;
            background-image: url('bg.png'); 
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-color: #05070a; 
            font-family: 'Share Tech Mono', monospace;
            color: var(--color-text);
            min-height: 100vh;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 10;
        }
        
        .container {
            max-width: 1100px; 
            margin: 30px auto; 
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px; 
            position: relative;
            z-index: 20; 
        }

        h1, h2, h3 {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1.main-title {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 2.6rem; 
            font-weight: 900; 
            color: #ff9d00; 
            
            text-shadow: 
                3px 3px 0px #000000, 
                -1px -1px 0 #000,  
                0 0 15px rgba(255, 127, 42, 0.8),
                0 0 30px rgba(255, 127, 42, 0.4);
            
            margin-bottom: 20px;
            
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(0, 0, 0, 0.9) 20%, 
                rgba(0, 0, 0, 0.9) 80%, 
                transparent 100%
            );
            
            border-bottom: 2px solid var(--color-accent-orange);
            border-top: 1px solid rgba(255, 127, 42, 0.3);
            padding: 15px 0;
            
            position: relative;
            z-index: 50;
            letter-spacing: 4px;
        }

        /* ========================================= */
        /* III. PANEL STYLING & STRUCTURE */
        /* ========================================= */

        .panel {
            background: var(--color-panel);
            border: var(--border-panel);
            padding: 20px; 
            box-shadow: var(--shadow-inset), 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
            backdrop-filter: blur(6px);
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            border-radius: 4px;
        }
        
        /* Ограничение высоты для обоих панелей */
        #input-panel, #output-panel {
            max-height: 88vh; 
        }

        /* Скролл контента для обоих панелей */
        #input-panel .panel-content, 
        #output-panel .panel-content {
            overflow-y: auto;
            padding-right: 5px; 
            margin-right: -10px;
            flex: 1; 
        }
        
        .panel-content::-webkit-scrollbar {
            width: 6px;
        }
        .panel-content::-webkit-scrollbar-thumb {
            background-color: var(--color-accent-orange);
            border-radius: 3px;
        }
        .panel-content::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .panel::before {
            content: ''; position: absolute; top: -4px; left: -4px; width: 12px; height: 12px;
            border-top: 2px solid var(--color-highlight-yellow); border-left: 2px solid var(--color-highlight-yellow);
        }
        .panel::after {
            content: ''; position: absolute; bottom: -4px; right: -4px; width: 12px; height: 12px;
            border-bottom: 2px solid var(--color-highlight-yellow); border-right: 2px solid var(--color-highlight-yellow);
        }

        h2.panel-title {
            font-size: 1.3rem; color: var(--color-neon-blue);
            border-bottom: 1px solid var(--color-neon-blue); padding-bottom: 8px; margin-top: 0;
            text-shadow: var(--neon-glow-blue-sm);
            flex-shrink: 0; 
        }
        
        h2.panel-title.total-header {
            font-size: 1.5rem; padding-bottom: 8px; margin-bottom: 12px; text-align: left;
        }

        /* ========================================= */
        /* IV. TABS & SEARCH */
        /* ========================================= */
        .tabs {
            display: flex; margin-bottom: 15px; border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            flex-shrink: 0; 
        }
        .tab-btn {
            background: rgba(0,0,0,0.6); color: var(--color-text-dim); border: 1px solid transparent; border-bottom: none;
            padding: 8px 15px; cursor: pointer; font-family: 'Orbitron', sans-serif; text-transform: uppercase;
            transition: all 0.2s; margin-right: 4px; font-size: 0.85rem;
        }
        .tab-btn:hover { color: var(--color-text); }
        .tab-btn.active {
            background: var(--color-panel); color: var(--color-accent-orange); border-color: var(--color-accent-orange);
            border-top-left-radius: 4px; border-top-right-radius: 4px; font-weight: bold;
            box-shadow: 0 -3px 10px rgba(255, 127, 42, 0.3); z-index: 1; position: relative; letter-spacing: 1px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        #search-input {
            width: 100%; padding: 8px; margin-bottom: 12px; background: rgba(0,0,0,0.4);
            border: 1px solid var(--color-text-dim); color: var(--color-text);
            font-family: 'Share Tech Mono', monospace; font-size: 1rem; box-sizing: border-box; 
            box-shadow: 0 0 5px rgba(0,0,0,0.5); transition: border-color 0.2s;
            flex-shrink: 0;
        }
        #search-input:focus { outline: none; border-color: var(--color-neon-blue); box-shadow: 0 0 8px rgba(0, 229, 255, 0.5); }

        /* Стиль для кнопки сброса крафта */
        #reset-button {
             width: 100%; margin: 0 0 15px 0; display: block; height: 38px; 
             font-size: 1rem; font-family: 'Orbitron', sans-serif;
             border: 2px solid #d9534f; color: var(--color-text); text-shadow: 1px 1px 2px #000;
             background: rgba(217, 83, 79, 0.7); transition: all 0.2s; box-sizing: border-box; cursor: pointer;
        }
        #reset-button:hover { background: #d9534f; box-shadow: 0 0 15px #d9534f; }
        
        /* НОВЫЙ СТИЛЬ: Кнопка сброса инвентаря (такой же стиль как у reset-button) */
        #reset-inventory-btn {
             width: 100%; margin: 0 0 15px 0; display: block; height: 38px;
             font-size: 1rem; font-family: 'Orbitron', sans-serif;
             border: 2px solid #d9534f; color: var(--color-text); text-shadow: 1px 1px 2px #000;
             background: rgba(217, 83, 79, 0.7); transition: all 0.2s; box-sizing: border-box; cursor: pointer;
             flex-shrink: 0;
        }
        #reset-inventory-btn:hover { background: #d9534f; box-shadow: 0 0 15px #d9534f; }
        
        #goals-controls, #goals-controls.active { padding: 0; display: block; flex-shrink: 0;}

        /* ========================================= */
        /* V. INPUT LISTS */
        /* ========================================= */
        
        .category-title {
            color: var(--color-highlight-yellow); margin: 10px 0 0 0; display: flex; align-items: center;
            font-size: 1rem; cursor: pointer; justify-content: space-between; transition: all 0.3s;
            padding: 8px 12px; background: rgba(255, 234, 90, 0.05); 
            border-left: 4px solid var(--color-highlight-yellow); border-bottom: 1px solid rgba(255, 234, 90, 0.2);
            user-select: none; font-family: 'Orbitron', sans-serif; text-shadow: var(--neon-glow-yellow-sm);
        }
        .category-title:hover { background: rgba(255, 234, 90, 0.1); box-shadow: 0 0 10px rgba(255, 234, 90, 0.2); }
        .category-title.collapsed { border-bottom: 1px solid rgba(255, 234, 90, 0.1); }

        .category-title .toggle-icon {
            font-size: 0.9rem; transition: transform 0.3s ease; transform: rotate(0deg); 
            color: var(--color-accent-orange); text-shadow: var(--neon-glow-orange);
        }
        .category-title:not(.collapsed) .toggle-icon { transform: rotate(90deg); }

        .items-list-content {
            max-height: 2000px; overflow: hidden; transition: max-height 0.4s ease-in-out;
        }
        .items-list-content.collapsed { max-height: 0; }
        .items-list-content-inner { padding: 5px 0 0 0; border-left: 1px dashed rgba(255, 255, 255, 0.05); }
        
        .item-row {
            display: flex; justify-content: space-between; align-items: center; padding: 6px 10px;
            background: rgba(0,0,0,0.2); border-bottom: 1px dashed rgba(90, 221, 255, 0.1); 
            transition: background 0.3s; cursor: default;
        }
        .item-row:hover { background: rgba(0, 229, 255, 0.05); }

        /* --- STYLES FOR ICONS --- */
        .item-wrapper {
            display: flex;
            align-items: center;
        }
        /* Уменьшаем иконки с 32px до 28px */
        .item-icon {
            width: 28px; height: 28px;
            margin-right: 10px;
            object-fit: contain;
            border-radius: 4px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(0, 229, 255, 0.1);
        }

        .quantity-control {
            display: flex; align-items: center; border: 1px solid var(--color-neon-blue); box-shadow: 0 0 5px rgba(0, 229, 255, 0.3);
        }
        
        /* Уменьшаем кнопки +/- */
        .qty-btn {
            background: rgba(0, 229, 255, 0.1); color: var(--color-neon-blue); border: none;
            width: 28px; height: 28px; font-weight: bold; font-size: 1.1rem;
            font-family: 'Orbitron', sans-serif; cursor: pointer; transition: all 0.2s; line-height: 1; padding: 0;
        }
        .qty-btn:hover { background: var(--color-neon-blue); color: var(--color-dark-bg); box-shadow: 0 0 8px var(--color-neon-blue); }

        /* Уменьшаем инпуты */
        .qty-input {
            width: 45px; height: 28px; background: var(--color-dark-bg); border: none;
            color: var(--color-highlight-yellow); text-align: center; font-family: 'Orbitron', sans-serif;
            font-size: 1rem; margin: 0; padding: 0; box-shadow: inset 0 0 3px rgba(255, 234, 90, 0.5);
            -moz-appearance: textfield; appearance: none;
        }
        .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        .inventory-input-container {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
            padding: 6px 12px; background: rgba(0,0,0,0.4); border-left: 3px solid var(--color-accent-orange);
            transition: background 0.2s;
        }
        .inventory-input-container:hover { background: rgba(255, 127, 42, 0.05); }
        .inventory-input {
            width: 70px; height: 28px; background: var(--color-dark-bg); border: 1px solid var(--color-accent-orange);
            color: var(--color-highlight-yellow); text-align: center; font-family: 'Orbitron', sans-serif;
            font-size: 1rem; -moz-appearance: textfield; box-shadow: 0 0 3px rgba(255, 127, 42, 0.5);
        }

        /* ========================================= */
        /* VI. OUTPUT LISTS */
        /* ========================================= */
        #base-total-list li {
            font-size: 1.15rem; padding: 10px 12px; border-bottom: 1px solid rgba(0, 229, 255, 0.15);
            background: rgba(0,0,0,0.25); margin-bottom: 4px; line-height: 1.4;
            display: flex; justify-content: space-between; align-items: center;
        }
        .res-name { font-weight: bold; color: var(--color-text); }
        .missing-resource { color: var(--color-missing); font-weight: bold; font-size: 1.3rem; text-shadow: 0 0 8px var(--color-missing); margin-right: 12px; }
        .enough-resource { color: var(--color-enough); font-weight: bold; font-size: 1.3rem; text-shadow: 0 0 8px var(--color-enough); margin-right: 12px; }
        .base-total-label { font-size: 0.75rem; color: var(--color-text-dim); font-family: 'Share Tech Mono', monospace; display: block; text-align: right; }

        #craft-total-list li {
            padding: 6px 12px; border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
            display: flex; justify-content: space-between; background: rgba(0,0,0,0.1);
        }
        .res-qty { color: var(--color-accent-orange); font-family: 'Orbitron', sans-serif; }
        
        .accordion-content {
            max-height: 3000px; overflow: hidden; transition: max-height 0.4s ease-in-out;
        }
        .accordion-content.collapsed { max-height: 0; }
        .accordion-content-inner { padding: 8px 0; }

        #recipe-breakdown-list ul { list-style: none; padding: 0; }
        #recipe-breakdown-list h4 {
            color: var(--color-highlight-yellow); text-shadow: var(--neon-glow-yellow-sm);
            margin: 12px 0 4px 0; border-bottom: 1px dashed rgba(255, 234, 90, 0.3);
            padding-bottom: 4px; font-size: 1.1rem; font-family: 'Orbitron', sans-serif;
        }
        
        .craft-item-toggle {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px 8px; border-left: 2px solid rgba(0, 229, 255, 0.5);
            font-size: 0.95rem; background: rgba(0,0,0,0.15); color: var(--color-text);
            cursor: pointer; user-select: none; transition: all 0.2s;
        }
        .craft-item-toggle.base-resource {
            border-left: 2px solid var(--color-accent-orange); color: var(--color-text-dim);
            background: rgba(255, 127, 42, 0.05); cursor: default;
        }
        .craft-item-toggle:hover { background: rgba(0, 229, 255, 0.1); }
        .craft-item-toggle.base-resource:hover { background: rgba(255, 127, 42, 0.1); }
        .craft-item-toggle.expanded { background: rgba(0, 229, 255, 0.2); border-left: 2px solid var(--color-neon-blue); }

        /* Вложенные списки рецептов */
        .recipe-item-children {
            max-height: 2000px; overflow: hidden; transition: max-height 0.4s ease-in-out;
            padding: 0; margin: 0;
        }
        .recipe-item-children.collapsed { max-height: 0; }
        .recipe-item-children-inner {
            padding-left: 12px; margin: 4px 0 4px 4px; border-left: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .craft-item-toggle .toggle-arrow {
            transition: transform 0.3s; display: inline-block; margin-right: 6px;
            color: var(--color-neon-blue); font-size: 0.75rem; transform: rotate(0deg);
        }
        .craft-item-toggle.expanded .toggle-arrow { transform: rotate(90deg); }
        .craft-item-toggle.base-resource .toggle-arrow:before { content: '•'; margin-right: 6px; color: var(--color-accent-orange); font-size: 1.1rem; display: inline-block; }
        .craft-item-toggle.base-resource .toggle-arrow { display: inline-block !important; transform: none !important; }

        .accordion-title {
            color: var(--color-highlight-yellow); border-bottom: 1px solid var(--color-highlight-yellow);
            padding: 8px 0; margin-top: 20px; text-shadow: var(--neon-glow-yellow-sm);
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            user-select: none; transition: background 0.2s;
        }
        .accordion-title:hover { background: rgba(255, 234, 90, 0.05); }
        .accordion-title .toggle-icon { font-size: 0.9rem; transition: transform 0.3s ease; transform: rotate(0deg); color: var(--color-neon-blue); text-shadow: var(--neon-glow-blue-sm); }
        .accordion-title:not(.collapsed) .toggle-icon { transform: rotate(90deg); }
        
        /* ========================================= */
        /* VII. KO-FI WIDGET STYLES */
        /* ========================================= */
        .kofi-widget {
            position: fixed;
            top: 25px; 
            left: 25px; 
            z-index: 2000; 
            display: flex;
            align-items: center;
            gap: 15px; 
            
            background: rgba(12, 18, 25, 0.65); 
            padding: 12px 20px; 
            border: 1px solid rgba(0, 229, 255, 0.3); 
            border-radius: 6px;
            backdrop-filter: blur(5px);
            
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .kofi-widget::after {
            content: "SUPPORT DEV";
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem; 
            font-weight: 700; 
            color: var(--color-text-dim);
            letter-spacing: 1.5px;
            transition: color 0.3s ease;
        }

        .kofi-widget img {
            height: 38px !important; 
            width: auto;
            filter: grayscale(100%) opacity(0.8); 
            transition: all 0.3s ease;
            vertical-align: middle;
        }

        .kofi-widget:hover {
            background: rgba(12, 18, 25, 0.98);
            border-color: var(--color-neon-blue);
            box-shadow: var(--neon-glow-blue-lg); 
            transform: translateY(2px) scale(1.02); 
        }

        .kofi-widget:hover img {
            filter: grayscale(0%) opacity(1); 
            transform: scale(1.1) rotate(-5deg); 
        }

        .kofi-widget:hover::after {
            color: var(--color-neon-blue);
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
        }

        /* Адаптив под мобильные */
        @media (max-width: 992px) {
            .container { grid-template-columns: 1fr; gap: 20px; margin: 20px auto; padding: 10px; max-width: 100%; }
            h1.main-title { font-size: 2rem; }
            .panel { max-height: none; padding: 15px; }
            #input-panel, #output-panel { max-height: 80vh; }
            .tab-btn { padding: 10px 10px; font-size: 0.8rem; }
        }
        
        @media (max-width: 768px) {
            .kofi-widget {
                top: auto;
                bottom: 20px; 
                left: 20px;
                padding: 10px 15px; 
            }
            .kofi-widget img {
                height: 32px !important; 
            }
            .kofi-widget::after {
                display: none; 
            }
        }
    </style>
</head>
<body>

<a href='https://ko-fi.com/U7U21PU1TF' target='_blank' class="kofi-widget" aria-label="Support via Ko-fi">
    <img src='https://storage.ko-fi.com/cdn/kofi6.png?v=6' alt='Buy Me a Coffee' />
</a>
<div class="container">
    <h1 class="main-title">ARC Raiders // Advanced Resource Calculator</h1>

    <div class="panel" id="input-panel">
        <h2 class="panel-title">Data Input</h2>
        <input type="text" id="search-input" placeholder="Search item or resource...">
        <div id="goals-controls" class="tab-content active">
             <button id="reset-button" aria-label="Reset all item quantities to zero.">RESET ALL CRAFTING</button>
        </div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="craft-goals">Crafting Goals</button>
            <button class="tab-btn" data-tab="inventory-input">My Inventory</button>
        </div>
        <div class="panel-content">
            <div id="craft-goals" class="tab-content active">
                <div id="items-container"></div>
            </div>
            <div id="inventory-input" class="tab-content">
                <button id="reset-inventory-btn" aria-label="Reset all inventory quantities to zero.">RESET INVENTORY</button>
                <div id="inventory-container"></div>
            </div>
        </div>
    </div>

    <div class="panel" id="output-panel">
        <h2 class="panel-title total-header">Total Base Resources Needed</h2>
        <div class="panel-content">
            <ul id="base-total-list"> 
                <div class="empty-state">Select items to calculate...</div>
            </ul>

            <h2 class="panel-title accordion-title collapsed" data-target="craft-total-content">
                Total Crafting Ingredients
                <span class="toggle-icon">▶</span> 
            </h2>
            <div id="craft-total-content" class="accordion-content collapsed">
                <div class="accordion-content-inner"> 
                    <ul id="craft-total-list">
                        <div class="empty-state">No intermediate materials needed.</div>
                    </ul>
                </div>
            </div>
            
            <h2 class="panel-title accordion-title collapsed" data-target="recipe-breakdown-content">
                Detailed Recipe Breakdown
                <span class="toggle-icon">▶</span> 
            </h2>
            <div id="recipe-breakdown-content" class="accordion-content collapsed">
                 <div class="accordion-content-inner"> 
                    <ul id="recipe-breakdown-list">
                        <div class="empty-state">Details will appear after selection...</div>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const STATE_KEYS = { SELECTION: 'arcRaidersSelection', INVENTORY: 'arcRaidersInventory' };
    
    let userSelection = JSON.parse(localStorage.getItem(STATE_KEYS.SELECTION) || '{}');
    let userInventory = JSON.parse(localStorage.getItem(STATE_KEYS.INVENTORY) || '{}');

    // --- FULL IMAGE MAP ---
    const IMAGE_MAP = {
        // Weapons
        'Ferro': 'ferro.png',
        'Hairpin': 'hairpin.png',
        'Kettle': 'kettle.png',
        'Stitcher': 'stitcher.png',
        'Rattler': 'rattler.png',
        'Anvil': 'anvil.png',
        'Arpeggio': 'arpeg.png',
        'Burletta': 'burletta.png',
        'Il Toro': 'iltoro.png',
        'Torrente': 'torr.png',
        'Osprey': 'osprey.png',
        'Venator': 'venat.png',
        'Renegade': 'reneg.png',
        'Bettina': 'bettina.png',
        'Tempest': 'tempest.png',
        'Bobcat': 'bobcat.png',
        'Vulcano': 'vulc.png',
        'Hullcracker': 'hullcr.png',
        'Jupiter': 'jupiter.png',
        'Equalizer': 'equal.png',

        // Weapon Attachments
        'Angled Grip I': 'agrip1.png',
        'Angled Grip II': 'agrip2.png',
        'Angled Grip III': 'agrip3.png',

    function parseMaterials(materialsString) {
        if (!materialsString) return null;
        const recipe = {};
        const normalizedString = materialsString.replace(/,\s*([A-Za-z])/g, '; $1').trim();
        const parts = normalizedString.split(';');
        for (const part of parts) {
            const trimmedPart = part.trim();
            const match = trimmedPart.match(/(.*)\s?[×x]\s?(\d+)$/i);
            if (match) recipe[match[1].trim()] = parseInt(match[2], 10);
        }
        return Object.keys(recipe).length > 0 ? recipe : null;
    }

    function getRecipe(itemName) {
        for (const category in ALL_CRAFT_DATA) {
            if (ALL_CRAFT_DATA[category][itemName]) return ALL_CRAFT_DATA[category][itemName];
        }
        return null;
    }
    function isCraftable(itemName) { return CRAFTABLE_ITEMS.has(itemName); }

    function getBaseResources(itemName, quantity, totalNeeded = {}) {
        if (BASE_RESOURCES.has(itemName)) {
            totalNeeded[itemName] = (totalNeeded[itemName] || 0) + quantity;
            return totalNeeded;
        }
        const recipe = getRecipe(itemName);
        if (!recipe) return totalNeeded; 
        for (const [ingredient, neededQty] of Object.entries(recipe)) {
            getBaseResources(ingredient, neededQty * quantity, totalNeeded);
        }
        return totalNeeded;
    }

    // РЕКУРСИВНЫЙ ПОДСЧЕТ ПРОМЕЖУТОЧНЫХ КОМПОНЕНТОВ
    function getIntermediateRecursive(itemName, quantity, totalNeeded = {}) {
        const recipe = getRecipe(itemName);
        if (!recipe) return totalNeeded;
        for (const [ingredient, neededQty] of Object.entries(recipe)) {
            if (isCraftable(ingredient)) {
                const qty = neededQty * quantity;
                totalNeeded[ingredient] = (totalNeeded[ingredient] || 0) + qty;
                getIntermediateRecursive(ingredient, qty, totalNeeded);
            }
        }
        return totalNeeded;
    }

    function getIntermediateTotals() {
        let intermediateTotals = {};
        for (const [item, qty] of Object.entries(userSelection)) {
             if (qty > 0 && isCraftable(item)) {
                getIntermediateRecursive(item, qty, intermediateTotals);
            }
        }
        return intermediateTotals;
    }

    function calculateTotal() {
        let grandTotal = {}; 
        for (const [item, qty] of Object.entries(userSelection)) {
            if (qty > 0) getBaseResources(item, qty, grandTotal);
        }
        const intermediateTotals = getIntermediateTotals(); 
        renderBaseTotal(grandTotal); 
        renderIntermediateTotals(intermediateTotals);
        renderRecipeBreakdown();
        localStorage.setItem(STATE_KEYS.SELECTION, JSON.stringify(userSelection));
    }

    function renderBaseTotal(grandTotal) {
        elements.baseTotalList.innerHTML = '';
        if (Object.keys(grandTotal).length === 0) {
            elements.baseTotalList.innerHTML = '<div class="empty-state">Select items to calculate...</div>';
            return;
        }
        const sortedResources = Object.entries(grandTotal).sort((a, b) => a[0].localeCompare(b[0]));
        for (const [resName, requiredQty] of sortedResources) {
            const inventoryQty = userInventory[resName] || 0;
            const neededQty = Math.max(0, requiredQty - inventoryQty);
            const statusClass = neededQty > 0 ? 'missing-resource' : 'enough-resource';
            const li = document.createElement('li');
            
            // ВСТАВКА ИКОНКИ
            li.innerHTML = `
                <div class="item-wrapper">
                    ${getIconHtml(resName)}
                    <span class="res-name">${resName}</span>
                </div>
                <span style="text-align: right;">
                    <span class="${statusClass}">x${requiredQty}</span>
                    <span class="base-total-label">Needed: ${requiredQty} (Have: ${inventoryQty})</span>
                </span>
            `;
            elements.baseTotalList.appendChild(li);
        }
    }

    function renderIntermediateTotals(intermediateTotals) {
        const innerList = elements.craftTotalContent.querySelector('.accordion-content-inner ul');
        innerList.innerHTML = '';
        const intermediateItems = Object.entries(intermediateTotals).filter(([item, qty]) => qty > 0).sort((a, b) => a[0].localeCompare(b[0]));
        if (intermediateItems.length === 0) {
             innerList.innerHTML = '<div class="empty-state">No intermediate materials needed.</div>';
             return;
        }
        for (const [itemName, totalQty] of intermediateItems) {
            const li = document.createElement('li');
            // ВСТАВКА ИКОНКИ
            li.innerHTML = `
                <div class="item-wrapper">

                </div>
                <span class="res-qty" style="color: var(--color-orange);">x${totalQty}</span>`;
            innerList.appendChild(li);
        }
    }

            if (isCraftable(itemName)) {
                const recipeList = renderRecipeTree(itemName, itemQty, false, true); 
                if (recipeList) mainLi.appendChild(recipeList);
            } else {
                mainLi.innerHTML += `<p style="margin-left: 10px;">&mdash; Base item, no recipe.</p>`;
            }
            outerUl.appendChild(mainLi);
        });
        innerList.appendChild(outerUl);
        attachTreeEventListeners();
    }
    
    function renderRecipeTree(itemName, itemQty, isNested = true, isRoot = false) {
        const recipe = getRecipe(itemName);
        if (!recipe) return null;

        const ul = document.createElement('ul');
        ul.className = `recipe-item-children ${isNested && !isRoot ? 'collapsed' : ''}`;
        const ulInner = document.createElement('div');
        ulInner.className = 'recipe-item-children-inner';
        
        const sortedIngredients = Object.entries(recipe).sort((a, b) => a[0].localeCompare(b[0]));

        for (const [ingredient, neededQty] of sortedIngredients) {
            const totalNeeded = neededQty * itemQty;
            const isInterm = isCraftable(ingredient);
            const li = document.createElement('li');
            li.className = 'recipe-item';
            
            const toggleDiv = document.createElement('div');
            const isExpandedInitial = isRoot && isInterm;
            toggleDiv.className = `craft-item-toggle ${isInterm ? 'craftable' : 'base-resource'} ${isExpandedInitial ? 'expanded' : ''}`; 
            
            const nestedListId = `nested-${ingredient.replace(/\s/g, '-')}-${Math.random().toString(36).substring(2, 9)}`;
            if (isInterm) toggleDiv.setAttribute('data-target', nestedListId);

            // ВСТАВКА ИКОНКИ В ДЕРЕВО
            toggleDiv.innerHTML = `
                <div style="display: flex; align-items: center;">
                    <span class="toggle-arrow">${isInterm ? (isExpandedInitial ? '▼' : '▶') : ''}</span>
                    ${getIconHtml(ingredient)}
                    <span class="item-name-display">${ingredient}</span>
                </div>
                <span class="res-qty">x${totalNeeded}</span>
            `;
            li.appendChild(toggleDiv);

            if (isInterm) {
                const nestedUl = renderRecipeTree(ingredient, totalNeeded, true, false); 
                if (nestedUl) {
                    nestedUl.id = nestedListId;
                    if (isNested) nestedUl.classList.add('collapsed');
                    li.appendChild(nestedUl);
                }
            }
            ulInner.appendChild(li);
        }
        ul.appendChild(ulInner);
        
        if (isRoot) ul.classList.remove('collapsed');
        return ul;
    }

    function renderItemsUI(filter = '') {
        elements.itemsContainer.innerHTML = '';
        const filterLower = filter.toLowerCase();
        const categoriesArray = Object.entries(ALL_CRAFT_DATA);
        
        for (const [catName, itemsMap] of categoriesArray) {
            const filteredItems = Object.keys(itemsMap).filter(item => item.toLowerCase().includes(filterLower));
            if (filteredItems.length === 0) continue;
            
            const catGroup = document.createElement('div');
            catGroup.className = 'category-group';
            
            const titleH3 = document.createElement('h3');
            titleH3.className = `category-title collapsed`; 
            const safeCatName = catName.replace(/\s/g, '-'); 
            titleH3.setAttribute('data-target', `content-${safeCatName}`);
            
            const emoji = CATEGORY_EMOJIS[catName] || '💎';
            titleH3.innerHTML = `<span>${emoji} ${catName}</span><span class="toggle-icon">▶</span>`;
            catGroup.appendChild(titleH3);

            const contentDiv = document.createElement('div');
            contentDiv.id = `content-${safeCatName}`;
            contentDiv.className = `items-list-content collapsed`; 
            const contentInnerDiv = document.createElement('div'); 
            contentInnerDiv.className = 'items-list-content-inner';

            filteredItems.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';
                const currentQty = userSelection[item] || 0;
                
                // ВСТАВКА ИКОНКИ В ГЛАВНЫЙ СПИСОК
                row.innerHTML = `
                    <div class="item-wrapper">
                        ${getIconHtml(item)}
                        <span class="item-name">${item}</span>
                    </div>
                    <div class="quantity-control">
                        <button class="qty-btn minus" data-item="${item}" aria-label="Decrease">-</button>
                        <input type="number" class="qty-input" value="${currentQty}" data-item="${item}" min="0" data-type="selection">
                        <button class="qty-btn plus" data-item="${item}" aria-label="Increase">+</button>
                    </div>
                `;
                contentInnerDiv.appendChild(row); 
            });
            
            contentDiv.appendChild(contentInnerDiv); 
            catGroup.appendChild(contentDiv);
            elements.itemsContainer.appendChild(catGroup);
        }
    }
    
    function renderInventoryUI(filter = '') {
        elements.inventoryContainer.innerHTML = '';
        const sortedBaseResources = Array.from(BASE_RESOURCES).sort();
        const filterLower = filter.toLowerCase();

        sortedBaseResources.filter(res => res.toLowerCase().includes(filterLower)).forEach(resName => {
            const currentQty = userInventory[resName] || 0;
            const row = document.createElement('div');
            row.className = 'inventory-input-container';
            // ВСТАВКА ИКОНКИ В ИНВЕНТАРЬ
            row.innerHTML = `
                <div class="item-wrapper">
                    ${getIconHtml(resName)}
                    <span class="item-name">${resName}</span>
                </div>
                <input type="number" class="inventory-input" value="${currentQty}" data-item="${resName}" min="0" data-type="inventory">
            `;
            elements.inventoryContainer.appendChild(row);
        });
    }

    // --- EVENT HANDLERS ---
    const handleInput = debounce((e) => {
        const item = e.target.dataset.item;
        const type = e.target.dataset.type;
        let newQty = parseInt(e.target.value) || 0;
        if (newQty < 0) newQty = 0;
        e.target.value = newQty;
        
        if (type === 'selection') {
            userSelection[item] = newQty;
            calculateTotal();
        } else if (type === 'inventory') {
            userInventory[item] = newQty;
            localStorage.setItem(STATE_KEYS.INVENTORY, JSON.stringify(userInventory)); 
            calculateTotal();
        }
    }, 300);

    function handleQuantityClick(e) {
        const btn = e.target.closest('.qty-btn');
        if (!btn) return;
        
        const item = btn.dataset.item;
        const isPlus = btn.classList.contains('plus');
        const input = btn.parentElement.querySelector('.qty-input'); 

        if (input) {
            let currentQty = parseInt(input.value) || 0;
            if (isPlus) currentQty++;
            else if (currentQty > 0) currentQty--;

            input.value = currentQty;
            userSelection[item] = currentQty;
            calculateTotal();
        }
    }
    
    function handleTabClick(e) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const tabId = e.target.dataset.tab;
        e.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');
        
        elements.goalsControls.classList.toggle('active', tabId === 'craft-goals');
        document.getElementById('inventory-input').style.display = tabId === 'inventory-input' ? 'block' : 'none';
        document.getElementById('craft-goals').style.display = tabId === 'craft-goals' ? 'block' : 'none';

        const currentFilter = elements.searchInput.value;
        if (tabId === 'inventory-input') {
             renderInventoryUI(currentFilter);
             elements.searchInput.oninput = debounce(() => renderInventoryUI(elements.searchInput.value), 200);
        } else if (tabId === 'craft-goals') {
             renderItemsUI(currentFilter);
             elements.searchInput.oninput = debounce(() => renderItemsUI(elements.searchInput.value), 200);
        }
    }

    function toggleSection(header, content) {
        const isCollapsed = content.classList.contains('collapsed');
        if (isCollapsed) {
            content.classList.remove('collapsed');
            header.classList.remove('collapsed');
            if (header.classList.contains('accordion-title')) header.classList.add('expanded');
            const icon = header.querySelector('.toggle-icon');
            if (icon) icon.textContent = '▼';
        } else {
            content.classList.add('collapsed');
            header.classList.add('collapsed');
            if (header.classList.contains('accordion-title')) header.classList.remove('expanded');
            const icon = header.querySelector('.toggle-icon');
            if (icon) icon.textContent = '▶';
        }
    }
    
    function attachTreeEventListeners() {
        document.querySelectorAll('#recipe-breakdown-list .craft-item-toggle.craftable').forEach(toggle => {
            toggle.onclick = (e) => {
                e.stopPropagation(); 
                const currentToggle = e.currentTarget; 
                const targetId = currentToggle.dataset.target;
                const content = document.getElementById(targetId);
                const icon = currentToggle.querySelector('.toggle-arrow');
                
                if (content) {
                    const isCollapsed = content.classList.contains('collapsed');
                    if (isCollapsed) {
                        content.classList.remove('collapsed');
                        currentToggle.classList.add('expanded');
                        if (icon) icon.textContent = '▼';
                    } else {
                        content.classList.add('collapsed');
                        currentToggle.classList.remove('expanded');
                        if (icon) icon.textContent = '▶';
                    }
                }
            };
        });
    }

    function attachAccordionEventListeners() {
        document.querySelectorAll('.accordion-title').forEach(title => {
            title.onclick = (e) => {
                const targetId = title.dataset.target;
                const content = document.getElementById(targetId);
                if (content) toggleSection(title, content);
            };
        });
    }

    function attachEventListeners() {
        elements.itemsContainer.addEventListener('click', (e) => handleQuantityClick(e));
        elements.itemsContainer.addEventListener('input', handleInput);
        elements.inventoryContainer.addEventListener('input', handleInput);
        
        elements.resetButton.onclick = () => {
            userSelection = {};
            localStorage.removeItem(STATE_KEYS.SELECTION);
            renderItemsUI(elements.searchInput.value);
            calculateTotal();
        };

        // ЛОГИКА ДЛЯ НОВОЙ КНОПКИ СБРОСА ИНВЕНТАРЯ
        elements.resetInventoryButton.onclick = () => {
            userInventory = {}; // Очищаем объект в памяти
            localStorage.removeItem(STATE_KEYS.INVENTORY); // Удаляем из памяти браузера
            renderInventoryUI(elements.searchInput.value); // Перерисовываем список (с учетом текущего фильтра поиска)
            calculateTotal(); // Пересчитываем итоги
        };

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = handleTabClick;
        });

        elements.searchInput.oninput = debounce(() => {
            const activeTab = document.querySelector('.tab-btn.active').dataset.tab;
            if (activeTab === 'craft-goals') renderItemsUI(elements.searchInput.value);
            else renderInventoryUI(elements.searchInput.value);
        }, 200);

        elements.itemsContainer.addEventListener('click', (e) => {
            const title = e.target.closest('.category-title');
            if (title) {
                const targetId = title.dataset.target;
                const content = document.getElementById(targetId);
                if (content) toggleSection(title, content);
            }
        });
        
        elements.goalsControls.classList.add('active');
        document.getElementById('inventory-input').style.display = 'none';
        attachAccordionEventListeners();
    }

    function debounce(func, delay) {
        let timeout;
        return function(...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), delay);
        };
    }

    document.addEventListener('DOMContentLoaded', () => {
        initializeData();
        getDOMElements();
        renderItemsUI();
        renderInventoryUI();
        attachEventListeners();
        calculateTotal();
    });
</script>

</body>
</html>
